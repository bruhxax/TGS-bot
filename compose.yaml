services:
  db:
    image: postgres:17-alpine
    container_name: tgs-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tgs_bot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: tgs-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2.10-alpine
    container_name: tgs-bot-caddy
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-tgs-bot.mooo.com}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tgs_bot_caddy_data:/data
      - tgs_bot_caddy_config:/config

volumes:
  tgs_bot_postgres:
    name: tgs_bot_v2_postgres
  tgs_bot_caddy_data:
    name: tgs_bot_v2_caddy_data
  tgs_bot_caddy_config:
    name: tgs_bot_v2_caddy_config
